version: "3.9"

# ── Breathe ESG — Local Development Stack ─────────────────────────────────────
# Usage:
#   docker compose up           — start all services
#   docker compose up --build   — rebuild after code changes
#   docker compose run --rm web python manage.py migrate
#   docker compose run --rm web python manage.py seed_demo
#   docker compose logs -f web  — tail application logs

services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: breathe_esg
      POSTGRES_USER: breathe
      POSTGRES_PASSWORD: breathe_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"          # Expose for local DB tools (TablePlus, DBeaver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breathe -d breathe_esg"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Django Backend ───────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn breathe.wsgi:application
               --bind 0.0.0.0:8000
               --workers 2
               --reload
               --access-logfile -"
    environment:
      DATABASE_URL: postgres://breathe:breathe_dev_password@db:5432/breathe_esg
      SECRET_KEY: dev-secret-key-change-in-production-please
      DEBUG: "true"
      ALLOWED_HOSTS: "localhost,127.0.0.1,web"
      CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000"
    volumes:
      - .:/app                # Live code reload during development
      - media_data:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ── React Frontend (Vite dev server) ─────────────────────────────────────────
  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - web

volumes:
  postgres_data:
  media_data:
