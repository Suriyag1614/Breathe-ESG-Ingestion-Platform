# render.yaml — Corrected 100% Free Tier Setup
services:

  # ── Django Web Service (Free Tier) ──────────────────────────────────────────
  - type: web
    name: breathe-esg-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free              # 🌟 Free Tier (0.25 CPU, 512 MB RAM)
    region: oregon
    branch: main
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "breathe-esg-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://breathe-esg.onrender.com"
      - key: GUNICORN_WORKERS
        value: "2"          
      - key: PORT
        value: "8000"
    autoDeploy: true

  # ── React Static Site (Always Free) ────────────────────────────────────────
  - type: web
    name: breathe-esg
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true

databases:
  # ── PostgreSQL Database (Free Tier) ────────────────────────────────────────
  - name: breathe-esg-db
    plan: free              
    region: oregon
    databaseName: breathe_esg
    user: breathe