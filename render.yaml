# render.yaml — Breathe ESG deployment on Render
# Docs: https://render.com/docs/blueprint-spec

services:

  # ── Django Web Service ───────────────────────────────────────────────────────
  - type: web
    name: breathe-esg-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /api/v1/health/
    
    # 🌟 FIX: Render executes this command on a disposable container before switching your traffic to the new build.
    # If migrations fail, the deployment is aborted safely without taking your old code down.
    preDeployCommand: python manage.py migrate --noinput
    
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: breathe-esg-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "breathe-esg-api.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://breathe-esg.onrender.com"
      - key: GUNICORN_WORKERS
        value: "4"
      - key: PORT
        value: "8000"
    autoDeploy: true

  # ── React Static Site ─────────────────────────────────────────────────────
  - type: web
    name: breathe-esg
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://breathe-esg-api.onrender.com/api/v1

databases:
  - name: breathe-esg-db
    plan: starter
    region: oregon
    databaseName: breathe_esg
    user: breathe